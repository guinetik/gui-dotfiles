"$schema" = 'https://starship.rs/config-schema.json'

# Starship Configuration - Vercel Aesthetic with Nerd Fonts
# "Terminal meets modern web" with phosphor green accents on pure black
# Two-line format: info on line 1, input on line 2. The branch gets the
# space on line 1; version/time modules are cut because starship has no
# responsive layout and they forced wraps
# Uses Nerd Font glyphs for all icons (no emojis, no pill-based rendering)
#
# IMPORTANT: For icons to display properly, you must:
# 1. Install a Nerd Font (e.g., via: all my homies install nerdfonts install FiraCode)
# 2. Configure your terminal to use the Nerd Font
# 3. Starship will automatically use Nerd Font symbols when a Nerd Font is active
# 
# If icons appear as boxes or question marks, your terminal font is not set to a Nerd Font

format = """
$os\
$username\
$status\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character\
"""

add_newline = true

# Vercel Phosphor Green Color Palette
palette = 'vercel_phosphor'

[palettes.vercel_phosphor]
phosphor_core = '#00ff41'      # Core phosphor green - git, success
phosphor_bright = '#39ff14'    # Bright phosphor - highlights, prompt char
phosphor_dim = '#00cc33'       # Dim phosphor - languages, secondary info
cyan = '#00e5ff'               # Cyan - directory, paths
amber = '#ffb800'              # Amber - time, metadata, duration
red = '#ff0000'                # Red - errors, critical states
white = '#ffffff'              # White - text on colored backgrounds
black = '#000000'              # Pure black - backgrounds

# ─────────────────────────────────────────
# Status (only displayed on command error)
# ─────────────────────────────────────────
[status]
format = '[ $status]($style) '
style = 'bold red'
disabled = false
pipestatus = true
pipestatus_separator = "|"
pipestatus_segment_format = "$status"

# ─────────────────────────────────────────
# Directory (Nerd Font: folder icon - more visible)
# ─────────────────────────────────────────
[directory]
format = '[$read_only$path]($style) · '
style = 'bold cyan'
truncation_length = 2
truncate_to_repo = true
home_symbol = '~'
read_only = '  '
read_only_style = 'bold red'

# ─────────────────────────────────────────
# Git Branch (Nerd Font: branch icon)
# ─────────────────────────────────────────
[git_branch]
format = '[ $symbol$branch ]($style) '
style = 'bold phosphor_core'

# ─────────────────────────────────────────
# Git Status (uses Starship's default Nerd Font symbols)
# ─────────────────────────────────────────
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'phosphor_bright'

# ─────────────────────────────────────────
# Fill - right-align everything after this
# ─────────────────────────────────────────
[fill]
symbol = ' '

# ─────────────────────────────────────────
# Language Runtimes (Nerd Font glyphs - larger, more visible)
# Note: Symbols use Starship's default Nerd Font icons
# Make sure you have a Nerd Font installed for icons to display
# ─────────────────────────────────────────

[nodejs]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['package.json', '.node-version', '.nvmrc']
detect_extensions = []
detect_folders = []

[python]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['requirements.txt', 'pyproject.toml', '.python-version', 'Pipfile', 'tox.ini', 'setup.py', '__pycache__']
detect_extensions = ['py']
detect_folders = []

[java]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['pom.xml', 'build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts']
detect_extensions = []
detect_folders = []

[golang]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['go.mod', 'go.sum', 'go.work', 'glide.yaml', 'Gopkg.yml', 'Gopkg.lock']
detect_extensions = ['go']
detect_folders = []

[rust]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['Cargo.toml', 'Cargo.lock']
detect_extensions = ['rs']
detect_folders = []

[bun]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['bun.lockb', 'bunfig.toml']
detect_extensions = []
detect_folders = []

[deno]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['deno.json', 'deno.jsonc', 'deno.lock']
detect_extensions = ['ts', 'tsx', 'js', 'jsx']
detect_folders = []

[zig]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = ['build.zig', 'build.zig.zon']
detect_extensions = ['zig']
detect_folders = []

[c]
format = '[ $symbol $version ]($style)'
style = 'bold phosphor_dim'
detect_files = []
detect_extensions = ['c', 'h']
detect_folders = []

# ─────────────────────────────────────────
# Command Duration (>500ms) (Nerd Font: timer icon)
# ─────────────────────────────────────────
[cmd_duration]
min_time = 500
format = '  [$duration]($style) '
style = 'bold phosphor_bright'
disabled = false

# ─────────────────────────────────────────
# Time (Nerd Font: clock icon)
# ─────────────────────────────────────────
[time]
format = '  [$time]($style) '
time_format = '%H:%M:%S'
style = 'bold phosphor_bright'
disabled = false

# ─────────────────────────────────────────
# Username (uses Starship's default Nerd Font symbol)
# ─────────────────────────────────────────
[username]
format = '[$user]($style_user) · '
style_user = 'bold phosphor_dim'
show_always = true

# ─────────────────────────────────────────
# OS (Nerd Font glyphs - no emojis)
# ─────────────────────────────────────────
[os]
format = '[$symbol]($style) · '
style = 'bold cyan'
disabled = false

# ─────────────────────────────────────────
# Prompt Character (uses Starship's default Nerd Font symbol)
# ─────────────────────────────────────────
[character]
format = '$symbol '
success_symbol = '[ ](bold phosphor_bright)'
error_symbol = '[ ](bold red)'
